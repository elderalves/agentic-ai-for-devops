name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel any run already in progress for the same branch/PR when a new commit
# arrives, so we don't burn runner minutes building a commit that's already
# superseded.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Least-privilege default: this job only needs to read the repo to build it.
# No write scopes (e.g. for PR comments, packages, deployments) are needed here.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # Guardrail so a hung/stuck step fails fast instead of consuming the
    # runner (and blocking the concurrency group) indefinitely.
    timeout-minutes: 15
    env:
      # Skip telemetry prompts/pings and the "first run" asset population -
      # both are non-deterministic latency/output on a CI runner.
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
      DOTNET_NOLOGO: 'true'
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # This job never pushes back to the repo, so don't leave a
          # git credential lying around in the workspace (least privilege).
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          # Key on everything that can change what gets restored: every
          # csproj (dependency versions), plus lock files/central package
          # management files if they're ever introduced. The previous key
          # only hashed *.csproj, so it was already close to correct here -
          # this broadens it so the cache is invalidated whenever the
          # dependency graph changes, not just when a csproj is touched.
          key: nuget-${{ runner.os }}-${{ hashFiles('src/**/*.csproj', 'src/**/packages.lock.json', 'src/**/Directory.Packages.props') }}
          # Fall back to the most recent cache for this OS on a miss so a
          # dependency bump only downloads what changed, not everything.
          # This only speeds up restore - `dotnet restore` always resolves
          # exact versions from the csproj files, so a partial/stale hit
          # can't produce incorrect packages, only a larger cache.
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore
        # Explicit configuration on restore too, since conditional
        # PackageReferences can vary by configuration - don't rely on the
        # implicit default (Debug) diverging from the Release build below.
        run: dotnet restore src/GenAIDevOps.sln --configuration Release

      - name: Build
        # --no-restore keeps restore and build as separate, explicit steps
        # instead of letting `build` implicitly restore with its own
        # (potentially different) settings.
        # ContinuousIntegrationBuild=true strips build-machine-specific
        # absolute paths from the output (e.g. embedded in PDBs) so the
        # same sources reliably produce byte-identical results.
        run: dotnet build src/GenAIDevOps.sln --configuration Release --no-restore -p:ContinuousIntegrationBuild=true

      - name: Test
        run: dotnet test src/GenAIDevOps.sln --configuration Release --no-build --logger "trx" --results-directory ./TestResults

      - name: Upload test results
        # Runs on both success and failure so a failing run still leaves the
        # TRX files behind for debugging.
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ./TestResults/*.trx
